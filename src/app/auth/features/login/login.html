<section class="auth-page">
  <div class="card">
    <h1>Iniciar Sesión</h1>
    <p class="sub">Accede a tu cuenta de profesional</p>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" type="button">Iniciar Sesión</button>
      <a class="tab" routerLink="/register">Registrarse</a>
    </div>

    <form (ngSubmit)="submit()" autocomplete="off">
      <label class="label">Correo electrónico</label>
      <input [(ngModel)]="email" name="email" type="email" placeholder="tu@email.com" required>

      <label class="label">Contraseña</label>
      <input [(ngModel)]="password" name="password" type="password" placeholder="********" required>

      <button type="submit" class="primary">Iniciar Sesión</button>

      <a class="muted-link" routerLink="/reset">¿Olvidaste tu contraseña?</a>
      <p class="helper">¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
    </form>
  </div>
</section>
