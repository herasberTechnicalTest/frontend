<form (ngSubmit)="submit()" autocomplete="off">
  <h1>Registro de profesional</h1>

  <input [(ngModel)]="model.fullName" name="fullName" placeholder="Nombre">
  <input [(ngModel)]="model.email" name="email" type="email" placeholder="Email">
  <input [(ngModel)]="model.password" name="password" type="password" placeholder="Contraseña">
  <input [(ngModel)]="model.phone" name="phone" placeholder="WhatsApp (51xxxxxxx)">

  <textarea [(ngModel)]="model.servicesDescription"
            name="servicesDescription"
            rows="5"
            placeholder="Descripción de servicios"></textarea>

  <input [(ngModel)]="model.cityName" name="cityName" placeholder="Ciudad">
  <input [(ngModel)]="model.districtName" name="districtName" placeholder="Distrito">
  <input [(ngModel)]="model.rate" name="rate" type="number" placeholder="Tarifa">
  <input [(ngModel)]="model.currency" name="currency" placeholder="Moneda (PEN / USD)">

  <label>Foto principal</label>
  <input type="file" accept="image/*" (change)="onAvatarChange($event)">
  <div *ngIf="avatarPreview" class="avatar-preview">
    <img [src]="avatarPreview" alt="preview">
    <div class="hint" *ngIf="uploadingAvatar">Procesando…</div>
  </div>

  <label>Galería (puedes elegir varias)</label>
  <input type="file" accept="image/*" multiple (change)="onGalleryChange($event)">
  <div class="gallery">
    <div class="thumb" *ngFor="let g of galleryPreviews; index as i">
      <img [src]="g" alt="galería">
      <button type="button" (click)="removeGalleryPreview(i)">✕</button>
    </div>
  </div>
  <div class="hint" *ngIf="uploadingGallery">Procesando galería…</div>

  <button type="submit" [disabled]="uploadingAvatar || uploadingGallery">
    Crear cuenta
  </button>
</form>
