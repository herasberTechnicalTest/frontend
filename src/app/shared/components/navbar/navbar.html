<ul class="links">
  <li><a routerLink="/professionals" >Inicio</a></li>

  <li *ngIf="!auth.loggedIn()"><a routerLink="/login">Acceder</a></li>

  <li *ngIf="auth.loggedIn() && auth.userId() as uid">
    <a [routerLink]="['/professionals', uid, 'edit']">Editar perfil</a>
  </li>

  <li *ngIf="auth.loggedIn()">
    <button class="link-btn" (click)="logout()">Log out</button>
  </li>
</ul>
