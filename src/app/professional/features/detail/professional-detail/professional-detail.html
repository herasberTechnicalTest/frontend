<ng-container *ngIf="pro() as p">
  <section class="head">
    <img class="avatar" [src]="p.photoUrl || 'https://via.placeholder.com/140?text=Avatar'">
    <div>
      <h1>{{p.fullName}}</h1>
      <p class="muted">{{p.servicesDescription}}</p>
      <p>Ubicación: {{p.districtName || p.cityName}}</p>
      <p *ngIf="p.rate">Tarifa aprox: {{p.currency}} {{p.rate}}</p>
      <a *ngIf="p.whatsappLink || p.phone"
         class="wa"
         [href]="p.whatsappLink || ('https://api.whatsapp.com/send?phone='+p.phone)"
         target="_blank" rel="noopener">
        Contactar por WhatsApp
      </a>
    </div>
  </section>

  <h2>Galería</h2>
  <app-photo-gallery [images]="p.gallery || []"></app-photo-gallery>

  <h2>Ubicación</h2>
  <app-map
    [mapsUrl]="p.mapsUrl"
    [query]="(p.districtName || '') + ' ' + (p.cityName || '')">
  </app-map>



</ng-container>
