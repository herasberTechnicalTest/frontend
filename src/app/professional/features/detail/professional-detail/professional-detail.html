<section *ngIf="!loading && professional as p">
  <header class="header">
    <img class="avatar" [src]="displayPhoto(p.photoUrl)" alt="foto de {{p.fullName}}" />
    <div>
      <h1>{{ p.fullName }}</h1>
      <p class="muted">{{ p.servicesDescription }}</p>
      <p>Ubicación: {{ p.districtName || '-' }}</p>
      <p *ngIf="p.rate">Tarifa aprox: {{ p.currency }} {{ p.rate }}</p>

      <a *ngIf="p.whatsappLink"
         class="btn btn-wa"
         [href]="p.whatsappLink"
         target="_blank" rel="noopener">
        Contactar por WhatsApp
      </a>
    </div>
  </header>

  <h2>Galería</h2>
  <div class="gallery" *ngIf="gallerySafe(p.gallery).length; else noGallery">
    <img *ngFor="let url of gallerySafe(p.gallery)" [src]="url" alt="foto de {{p.fullName}}" />
  </div>
  <ng-template #noGallery><p class="muted">Sin fotos de galería.</p></ng-template>

  <h2>Ubicación</h2>
  <app-map [mapsUrl]="p.mapsUrl"
           [query]="(p.districtName || '') + ' ' + (p.cityName || '')">
  </app-map>
</section>

<section *ngIf="loading">
  Cargando…
</section>
