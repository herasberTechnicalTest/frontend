<a class="card" [routerLink]="['/pros', pro().id]">
  <img [src]="pro().photoUrl || 'https://via.placeholder.com/300x200?text=Avatar'" alt="">
  <div class="body">
    <h3>{{pro().fullName}}</h3>
    <p class="muted ellipsis">{{pro().servicesDescription}}</p>
    <p>Ubicación: {{pro().districtName || pro().cityName}}</p>
    <p *ngIf="pro().rate">Tarifa aprox: {{pro().currency}} {{pro().rate}}</p>
  </div>
</a>
