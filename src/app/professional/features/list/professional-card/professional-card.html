<a class="card" [routerLink]="['/professionals', professionals.id]">
  <div class="thumb">
    <img [src]="displayPhoto(professionals.photoUrl)" alt="foto de {{professionals.fullName}}" />
  </div>

  <h3>{{ professionals.fullName }}</h3>
  <p class="muted">{{ professionals.servicesDescription }}</p>
  <p>Ubicación: {{ professionals.districtName || '-' }}</p>
  <p *ngIf="professionals.rate">Tarifa aprox: {{ professionals.currency }} {{ professionals.rate }}</p>
</a>
