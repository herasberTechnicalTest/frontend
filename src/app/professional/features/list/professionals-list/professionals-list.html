<h1>Profesionales</h1>

<div class="filters">
  <input [(ngModel)]="q" placeholder="Buscar..." (ngModelChange)="load()">
  <input [(ngModel)]="cityName" placeholder="Ciudad" (ngModelChange)="load()">
  <input [(ngModel)]="districtName" placeholder="Distrito" (ngModelChange)="load()">
  <app-price-filter (change)="onPrice($event)"></app-price-filter>
</div>

<div *ngIf="loading()" class="muted">Cargando…</div>
<div *ngIf="!loading() && items().length === 0" class="muted">No se encontraron profesionales.</div>

<div class="grid" *ngIf="!loading() && items().length">
  <app-professional-card *ngFor="let p of items()" [pro]="p"></app-professional-card>
</div>
