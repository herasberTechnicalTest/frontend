<h1>Profesionales</h1>

<div class="filters">
  <input [(ngModel)]="q" placeholder="Buscar...">
  <input [(ngModel)]="cityName" placeholder="Ciudad">
  <input [(ngModel)]="districtName" placeholder="Distrito">
  <input type="number" [(ngModel)]="minRate" placeholder="Mín S/">
  <input type="number" [(ngModel)]="maxRate" placeholder="Máx S/">
  <button type="button" (click)="applyFilters()">Filtrar</button>
  <button type="button" (click)="clearFilters()">Limpiar</button>
</div>

<div class="status" *ngIf="loading()">Actualizando resultados…</div>

<div class="grid">
  <app-professional-card
    *ngFor="let p of items(); trackBy: trackById"
    [professionals]="p">
  </app-professional-card>
</div>
